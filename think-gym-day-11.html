e","Cannot tell"],2,"The only colour left is blue."],["logic",3,"Every owl in the puzzle wears a hat. Niko is a owl in the puzzle. What must be true?",["Niko wears a hat","Niko is asleep","Niko is large","Niko can fly"],0,"The rule applies to every owl, including Niko."],["real",1,"You have 31 coins and spend 7. How many coins are left?",["38","7","26","24"],3,"31 − 7 = 24."],["real",1,"There are 4 children. Each needs 3 paper sheets. How many sheets are needed?",["15","12","7","9"],1,"4 × 3 = 12 sheets."],["real",1,"Practice starts at 6:00 and lasts 15 minutes. When does it finish?",["6:15","7:00","6:10","7:15"],0,"Adding 15 minutes to 6:00 gives 6:15."],["real",2,"36 children travel in cars that hold 4 children each. What is the fewest number of cars needed?",["18","10","9","8"],2,"8 cars are not enough, so 9 cars are needed."],["real",2,"You buy 2 notebooks for 6 coins each and pay 50 coins. What change do you get?",["38","43","12","44"],0,"The cost is 2 × 6 = 12; 50 − 12 = 38."],["real",2,"You have 36 coins and spend 12. How many coins are left?",["26","48","24","12"],2,"36 − 12 = 24."],["real",2,"There are 4 children. Each needs 4 paper sheets. How many sheets are needed?",["20","12","16","8"],2,"4 × 4 = 16 sheets."],["real",3,"Practice starts at 6:00 and lasts 20 minutes. When does it finish?",["6:20","7:00","6:15","7:20"],0,"Adding 20 minutes to 6:00 gives 6:20."],["real",3,"24 children travel in cars that hold 4 children each. What is the fewest number of cars needed?",["12","7","5","6"],3,"5 cars are not enough, so 6 cars are needed."],["real",3,"You buy 3 notebooks for 5 coins each and pay 50 coins. What change do you get?",["15","40","45","35"],3,"The cost is 3 × 5 = 15; 50 − 15 = 35."],["ai",1,"Which prompt is clearest for getting help with homework?",["Give answer","Explain 24 ÷ 6 step by step for an 8-year-old","Do homework","Maths"],1,"A clear prompt says the task, method, and learner level."],["ai",1,"An AI gives a surprising fact. What should you do id);scrollTo(0,0)}function home(){$("who").innerHTML="";[[true,"🟣🟠 Fatima & Awais"],[false,"One player"]].forEach(w=>{let b=document.createElement("button");b.className="lv"+(duo===w[0]?" on":"");b.textContent=w[1];b.onclick=()=>{duo=w[0];home()};$("who").append(b)});$("stats").innerHTML='<span class="chip">Day 11 of 30</span>';$("skills").innerHTML="";SK.forEach(s=>{let b=document.createElement("button");b.className="skill";b.innerHTML='<span class="em">'+s.em+'</span><span><b>'+s.n+'</b><br><small>'+s.b+'</small></span>';b.onclick=()=>start(s.id);$("skills").append(b)});show("start")}function start(mode){state={list:[],i:0,score2:[0,0],answers:[],pick:[null,null],mode:mode,done:false};let pool=mode==="daily"?SK.map(s=>shuffle(Q.filter(q=>q.s===s.id))[0]):shuffle(Q.filter(q=>q.s===mode)).slice(0,5);pool.sort((a,b)=>a.d-b.d);state.list=pool.map(q=>{let z=shuffle([0,1,2,3]);return{s:q.s,p:q.p,q:q.q,e:q.e,o:z.map(i=>q.o[i]),a:z.indexOf(q.a)}});show("quiz");render()}function dots(){let z=$("dots");z.innerHTML="";(duo?[0,1]:[0]).forEach(p=>{let r=document.createElement("div");r.className="pd";r.innerHTML=duo?'<b class="pc'+p+'">'+NAMES[p]+'</b>':"";state.list.forEach((_,i)=>{let d=document.createElement("span");d.className="dot"+(i===state.i?" now":"");if(i<state.answers.length)d.className="dot "+(state.answers[i].right[p]?"ok":"try");r.append(d)});z.append(r)})}function render(){let q=state.list[state.i],s=sk(q.s);dots();$("qtag").textContent=s.em+" "+s.n+" · "+(state.i+1)+"/"+state.list.length;$("qtext").textContent=q.q;$("passage").hidden=!q.p;$("passage").textContent=q.p||"";$("opts").innerHTML="";q.o.forEach((x,i)=>{let b=document.createElement("button");b.className="opt";b.innerHTML='<span class="k">'+LET[i]+'</span><span>'+x+'</span>';if(!duo)b.onclick=()=>{state.pick=[i,i];reveal()};else b.disabled=true;let li=document.createElement("li");li.append(b);$("opts").append(li)});$("duo").innerHTML="";if(duo)[0,1].forEach(p=>{let r=document.createElement("div");r.clas
