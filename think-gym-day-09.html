ll"],2,"The only colour left is green."],["logic",3,"Every owl in the puzzle wears a hat. Niko is a owl in the puzzle. What must be true?",["Niko wears a hat","Niko is asleep","Niko is large","Niko can fly"],0,"The rule applies to every owl, including Niko."],["real",1,"You have 29 coins and spend 5. How many coins are left?",["24","5","26","34"],0,"29 − 5 = 24."],["real",1,"There are 2 children. Each needs 3 paper sheets. How many sheets are needed?",["3","9","5","6"],3,"2 × 3 = 6 sheets."],["real",1,"Practice starts at 4:00 and lasts 30 minutes. When does it finish?",["4:30","5:00","4:25","5:30"],0,"Adding 30 minutes to 4:00 gives 4:30."],["real",2,"34 children travel in cars that hold 4 children each. What is the fewest number of cars needed?",["8","17","9","10"],2,"8 cars are not enough, so 9 cars are needed."],["real",2,"You buy 2 notebooks for 4 coins each and pay 50 coins. What change do you get?",["47","42","8","46"],1,"The cost is 2 × 4 = 8; 50 − 8 = 42."],["real",2,"You have 34 coins and spend 10. How many coins are left?",["26","10","44","24"],3,"34 − 10 = 24."],["real",2,"There are 2 children. Each needs 4 paper sheets. How many sheets are needed?",["8","6","12","4"],0,"2 × 4 = 8 sheets."],["real",3,"Practice starts at 4:00 and lasts 10 minutes. When does it finish?",["4:10","5:00","4:05","5:10"],0,"Adding 10 minutes to 4:00 gives 4:10."],["real",3,"22 children travel in cars that hold 4 children each. What is the fewest number of cars needed?",["5","7","6","11"],2,"5 cars are not enough, so 6 cars are needed."],["real",3,"You buy 3 notebooks for 3 coins each and pay 50 coins. What change do you get?",["46","41","9","47"],1,"The cost is 3 × 3 = 9; 50 − 9 = 41."],["ai",1,"Which prompt is clearest for getting help with homework?",["Maths","Do homework","Give answer","Explain 24 ÷ 6 step by step for an 8-year-old"],3,"A clear prompt says the task, method, and learner level."],["ai",1,"An AI gives a surprising fact. What should you do first?",["Share it imme ows everything"],1,"AI is a tool, so people must review its output."],["read",1,"Where was the water bottle placed?",["The museum","Beside the door","Under the bed","At school"],1,"The passage says it was placed beside the door.","Rohan visited the museum after lunch. Before leaving, Rohan placed a water bottle beside the door so it would not be forgotten."],["read",1,"What can you infer about the weather?",["It was raining","It was snowing","It was very hot","It was clear"],0,"The umbrella and drops show that it was raining.","Dark clouds covered the sky. Sara opened an umbrella, and drops tapped on the path while walking to the playground."],["read",1,"What does “delighted” mean here?",["very happy","very small","very fast","very noisy"],0,"In this passage, delighted means very happy.","Kabir was delighted by the surprise and smiled all afternoon."],["read",2,"Where was the blue notebook placed?",["The garden","Beside the door","Under the bed","At school"],1,"The passage says it was placed beside the door.","Fatima visited the garden after lunch. Before leaving, Fatima placed a blue notebook beside the door so it would not be forgotten."],["read",2,"What can you infer about the weather?",["It was raining","It was snowing","It was very hot","It was clear"],0,"The umbrella and drops show that it was raining.","Dark clouds covered the sky. Awais opened an umbrella, and drops tapped on the path while walking to the market."],["read",2,"What does “delighted” mean here?",["very happy","very small","very fast","very noisy"],0,"In this passage, delighted means very happy.","Maya was delighted by the surprise and smiled all afternoon."],["read",2,"Where was the small umbrella placed?",["The playground","Beside the door","Under the bed","At school"],1,"The passage says it was placed beside the door.","Rohan visited the playground after lunch. Before leaving, Rohan placed a small umbrella beside the door so it would not be forgotten."],["read",3,"What can you infer about the
